name: Windows checks
on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      for-release:
        type: boolean
        default: false
    outputs:
      commit:
        value: ${{ jobs.check.outputs.commit }}
      version:
        value: ${{ jobs.check.outputs.version }}
permissions:
  contents: read
jobs:
  check:
    runs-on: windows-latest
    outputs:
      commit: ${{ steps.metadata.outputs.commit }}
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          ref: ${{ inputs.for-release && 'main' || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Resolve build version and source
        id: metadata
        shell: pwsh
        env:
          FOR_RELEASE: ${{ inputs.for-release }}
        run: |
          $version=(Get-Content package.json -Raw|ConvertFrom-Json).version
          if($version -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$'){throw 'Invalid release version'}
          if($env:FOR_RELEASE -eq 'true' -and (git tag --list "v$version")){throw "v$version already exists; bump the main version before publishing"}
          "commit=$(git rev-parse HEAD)" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node node_modules/electron/install.js
      - run: npm rebuild @deepseek-ai/dsh-subprocess-local koffi node-pty protobufjs
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
      - name: Cache default evaluation model for hidden Electron checks
        run: npm run assets
      - run: npm run check:ui
      - run: npm run check:exit
      - name: Build portable candidate
        if: github.repository == 'entropy622/PekoPet' && github.event_name != 'pull_request'
        run: npm run package:windows -- --destination dist/PekoPet-windows-x64
      - name: Check actual portable outside the source checkout
        if: github.repository == 'entropy622/PekoPet' && github.event_name != 'pull_request'
        shell: pwsh
        run: |
          $portable=Join-Path $env:RUNNER_TEMP 'PekoPet portable'
          Move-Item -LiteralPath (Join-Path $pwd 'dist/PekoPet-windows-x64') -Destination $portable
          $env:PEKO_UI_EXE=Join-Path $portable 'PekoPet.exe'
          $env:PEKO_UI_ROOT=Join-Path $portable 'resources/runtime'
          $env:PEKO_UI_OUT=Join-Path $pwd 'work/electron-portable-checks'
          npm run check:ui
          $env:PEKO_UI_OUT=Join-Path $pwd 'work/exit-portable-checks'
          npm run check:exit
      - uses: actions/upload-artifact@v4
        if: github.repository == 'entropy622/PekoPet' && github.event_name != 'pull_request'
        with:
          name: PekoPet-portable-windows-x64
          path: dist/PekoPet-windows-x64.zip

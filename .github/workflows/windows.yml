name: Windows checks
on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      for-release:
        type: boolean
        default: false
    outputs:
      commit:
        value: ${{ jobs.check.outputs.commit }}
      version:
        value: ${{ jobs.check.outputs.version }}
permissions:
  contents: read
jobs:
  check:
    runs-on: windows-latest
    outputs:
      commit: ${{ steps.metadata.outputs.commit }}
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          ref: ${{ inputs.for-release && 'main' || github.sha }}
          fetch-depth: 0
      - name: Fetch public Cubism Framework only
        run: git submodule update --init --recursive vendor/cubism-framework
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: dtolnay/rust-toolchain@stable
      - name: Resolve build version and source
        id: metadata
        shell: pwsh
        env:
          FOR_RELEASE: ${{ inputs.for-release }}
        run: |
          $version=(Get-Content package.json -Raw|ConvertFrom-Json).version
          if($version -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$'){throw 'Invalid release version in package.json'}
          $cargo=(& cargo metadata --format-version 1 --no-deps --locked)|ConvertFrom-Json
          if($LASTEXITCODE -ne 0){throw 'Cargo version metadata failed'}
          $tauri=(Get-Content crates/pekopet/tauri.conf.json -Raw|ConvertFrom-Json).version
          if($tauri -ne $version -or @($cargo.packages|Where-Object{$_.version -ne $version}).Count){throw 'package.json, Cargo workspace and Tauri versions must agree'}
          if($env:FOR_RELEASE -eq 'true' -and (git tag --list "v$version")){throw "v$version already exists; bump the main version before publishing again"}
          "commit=$(git rev-parse HEAD)" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-tauri-release-v1
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm rebuild @deepseek-ai/dsh-subprocess-local koffi node-pty protobufjs
      - run: npm run build:frontend
      - run: npm test
      - run: cargo test -p peko-core --locked
      - name: Type-check Tauri client
        env:
          PEKO_TYPECHECK: '1'
        run: cargo check -p pekopet --locked
      - name: Prepare SDK under the repository owner's license consent
        if: github.repository == 'entropy622/PekoPet' && github.event_name != 'pull_request'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force local/sdk | Out-Null
          Invoke-WebRequest 'https://cubism.live2d.com/sdk-native/bin/CubismSdkForNative-5-r.5.zip' -OutFile local/sdk/native.zip
          Expand-Archive local/sdk/native.zip -DestinationPath local/sdk
          ./scripts/import-sdk.ps1 -SdkPath local/sdk/CubismSdkForNative-5-r.5
      - name: Check native bridge before release optimization
        if: github.repository == 'entropy622/PekoPet' && github.event_name != 'pull_request'
        shell: cmd
        timeout-minutes: 5
        run: |
          cargo check -p pekopet --locked > native-check.log 2>&1
          set result=%errorlevel%
          type native-check.log
          exit /b %result%
      - name: Build native portable candidate
        if: github.repository == 'entropy622/PekoPet' && github.event_name != 'pull_request'
        shell: cmd
        timeout-minutes: 45
        run: |
          call npm run package:windows -- -DestinationPath dist/PekoPet-windows-x64 > portable-build.log 2>&1
          set result=%errorlevel%
          type portable-build.log
          exit /b %result%
      - uses: actions/upload-artifact@v4
        if: github.repository == 'entropy622/PekoPet' && github.event_name != 'pull_request'
        with:
          name: PekoPet-portable-windows-x64
          path: dist/PekoPet-windows-x64.zip

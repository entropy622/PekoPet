name: Windows checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: cargo test -p peko-core --locked
      - name: Type-check GPUI client
        env:
          PEKO_TYPECHECK: '1'
        run: cargo check -p pekopet --locked
      - name: Prepare SDK under the repository owner's license consent
        if: github.repository == 'entropy622/PekoPet' && github.event_name != 'pull_request'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force local/sdk | Out-Null
          Invoke-WebRequest 'https://cubism.live2d.com/sdk-native/bin/CubismSdkForNative-5-r.5.zip' -OutFile local/sdk/native.zip
          Expand-Archive local/sdk/native.zip -DestinationPath local/sdk
          ./scripts/import-sdk.ps1 -SdkPath local/sdk/CubismSdkForNative-5-r.5
      - name: Build native application
        if: github.repository == 'entropy622/PekoPet' && github.event_name != 'pull_request'
        run: cargo build -p pekopet --release --locked
      - uses: actions/upload-artifact@v4
        if: github.repository == 'entropy622/PekoPet' && github.event_name != 'pull_request'
        with:
          name: PekoPet-native-windows-x64
          path: target/release/pekopet.exe

<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>PekoPet</title><style>html{background:#f1f5f9;color:#334155;font:15px system-ui;height:100%;display:grid;place-items:center}body{text-align:center}h1{font-size:24px}button{border:0;border-radius:16px;background:#6366f1;color:white;padding:12px 20px;cursor:pointer}</style><h1>PekoPet</h1><p id="status">正在启动助手…</p><button id="retry" hidden>重试启动</button><script>window.peko.listen('peko-state',({payload:s})=>{document.querySelector('#status').textContent=s.error||s.status;document.querySelector('#retry').hidden=!s.error});document.querySelector('#retry').onclick=()=>window.peko.invoke('peko_reload_config');</script></html>
